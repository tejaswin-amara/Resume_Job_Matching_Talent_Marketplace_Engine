pre-commit:
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
    mypy-check:
      glob: "*.py"
      run: uv run mypy --explicit-package-bases .
    check-imports:
      glob: "core/engine/**/*.py"
      run: if grep -E 'import (collections|heapq|bisect|networkx)' {staged_files} || grep -E 'from (collections|heapq|bisect|networkx) import' {staged_files}; then echo 'Forbidden imports in core/engine'; exit 1; fi
    web-typecheck:
      glob: "web/src/**/*.{ts,tsx}"
      run: cd web && pnpm run typecheck && cd ..
    gitleaks:
      run: gitleaks detect --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: npx --yes @commitlint/cli --config commitlint.config.js --edit {1}
