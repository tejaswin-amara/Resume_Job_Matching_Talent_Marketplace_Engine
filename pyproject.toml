[project]
name = "resume-job-matching-engine"
version = "0.1.0"
description = "Resume & Job Matching Talent Marketplace Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pgvector",
    "sentence-transformers",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-multipart",
    "pypdf",
    "python-docx",
    "httpx",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "schemathesis>=4.0.0",
    "testcontainers[postgres]>=4.0.0",
    "locust>=2.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99
exclude = [
    "scratch",
    "web",
    ".venv",
    ".agents",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",
    "B009",
    "E501",
    "C901",
    "C414",
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "UP035",
    "UP046",
    "E741",
    "B905",
    "SIM108",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",
    "S101",
    "F841",
    "RUF005",
    "RUF059",
    "B007",
    "B904",
    "C401",
    "C414",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM109",
    "SIM110",
    "W291",
    "F401",
    "I001",
    "E402",
]
"core/engine/**/*.py" = [
    "UP035",
    "UP046",
    "E741",
    "C414",
    "SIM102",
    "SIM110",
    "I001",
    "RUF005",
    "RUF012",
    "F841",
]
"migrations/**/*.py" = [
    "E402",
]
