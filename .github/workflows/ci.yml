name: "Polyglot CI Pipeline & Trivy Container Security"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          cd engine && pytest

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Test Java Backend
        run: |
          cd backend && mvn test

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Frontend Vitest & Biome Checks
        run: |
          cd frontend && pnpm install --no-frozen-lockfile && pnpm test

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
