name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1edb52370007f30018b14e3e3b33df051a8a25c1 # v5.3.0
      - run: uv sync --extra dev
      - name: Ruff Lint
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .
      - name: Mypy Static Type Analysis
        run: uv run mypy --explicit-package-bases .

  security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@e8529e3a6c59231f24fc600c3c861dc783262602 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep ci --config=semgrep.yml
      - name: Run Pinned Trivy Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  test-backend:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1edb52370007f30018b14e3e3b33df051a8a25c1 # v5.3.0
      - run: uv sync --extra dev
      - name: Run Alembic Migrations
        run: uv run alembic upgrade head
      - name: Run Pytest Suites
        run: uv run pytest tests/ --cov=core --cov=api --cov-report=term-missing -q

  test-frontend:
    name: Frontend Lint, Typecheck, Build & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298ae8caf4d9168b # v3.0.0
        with:
          version: 9
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run Next.js / ESLint
        run: pnpm run lint
      - name: Run TypeScript Compiler Check
        run: pnpm run typecheck
      - name: Run Vitest Component Tests
        run: pnpm run test
      - name: Run Next.js Production Build
        run: pnpm run build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E Tests (Standard & Reduced-Motion)
        run: pnpm exec playwright test
