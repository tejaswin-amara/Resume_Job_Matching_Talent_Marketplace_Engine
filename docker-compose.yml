version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: talent_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: talent_engine
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  engine:
    build:
      context: ./engine
    container_name: talent_engine_algo
    ports:
      - "8000:8000"
    command: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    depends_on:
      - db
      - redis

  backend:
    build:
      context: ./backend
    container_name: talent_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: talent_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/v1
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
