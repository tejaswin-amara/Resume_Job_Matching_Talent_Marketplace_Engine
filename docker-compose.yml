version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: talent_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: talent_engine
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
    container_name: talent_engine_algo
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db

  backend:
    build:
      context: ./backend
    container_name: talent_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - ENGINE_HOST=engine
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: talent_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/v1
    depends_on:
      - backend
